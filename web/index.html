<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deck of Worlds</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="ui">
      <button id="status" type="button" title="Phone camera status. Click for connection help.">
        <span class="dot"></span><span id="status-text">Simulated cards</span>
      </button>

      <button id="combos-open" type="button" title="See every combination of cards side by side (V)">
        <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="0" y="0" width="6" height="6" rx="1.2" /><rect x="8" y="0" width="6" height="6" rx="1.2" /><rect x="0" y="8" width="6" height="6" rx="1.2" /><rect x="8" y="8" width="6" height="6" rx="1.2" /></svg>
        Combinations
      </button>

      <button id="view-reset" type="button" title="Back to the usual view (double-click the world, or press 0)" hidden>Reset view</button>

      <section id="table-panel" aria-label="Table map and simulated cards" hidden>
        <div id="tray" aria-label="Drag a card onto the table or the world"></div>
        <!-- Any other word: typed here, it becomes a card in the tray and lands on the table. -->
        <form id="tray-add" autocomplete="off">
          <input id="tray-word" type="text" maxlength="40" spellcheck="false" enterkeyhint="done" placeholder="Add any word…" aria-label="Add any word as a card">
          <button type="submit" title="Make a card from this word and put it on the table">Add</button>
        </form>
        <p id="tray-status" role="status" aria-live="polite"></p>
        <div id="table">
          <span class="edge far">far side</span>
          <span class="edge near">your side</span>
        </div>
      </section>
      <!-- Shown while the card panel is closed, so it is obvious how to open it. -->
      <button id="tab-hint" type="button" title="Open the panel of cards to drag onto the world"><b>Tab</b> open the card panel</button>

      <section id="connect" hidden>
        <h2>Connect the phone camera</h2>
        <div id="connect-body"></div>
        <button type="button" id="connect-close">Close</button>
      </section>

      <div id="toast" role="status"></div>
      <div id="keys"><b>G</b> setup guide · <b>C</b> card check · <b>P</b> phone · <b>F</b> fullscreen · <b>R</b> rotate table · <b>L</b> re-find border · <b>B</b> labels · <b>V</b> combinations · <b>H</b> hide panels · <b>M</b> sound</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
