<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck of Worlds: tracking debug</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 18px; background: #0f1218; color: #e8ebf0; font: 14px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8f9aad; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 300px; gap: 16px; align-items: start; }
  .panel { background: #171b24; border: 1px solid #262c38; border-radius: 10px; padding: 12px; }
  img.view { width: 100%; border-radius: 6px; background: #000; display: block; min-height: 120px; }
  button { font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid #394150; background: #222836; color: inherit; cursor: pointer; }
  button:hover { background: #2c3445; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-weight: 600; font-size: 12px; background: #3a4150; }
  .pill.ok { background: #15803d; } .pill.bad { background: #b91c1c; } .pill.warn { background: #b45309; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid #262c38; vertical-align: middle; }
  td img { height: 30px; border-radius: 3px; background: #fff; display: block; max-width: 170px; }
  .qr { background: #fff; border-radius: 8px; width: 100%; display: block; }
  code { font-size: 12px; word-break: break-all; color: #9ecbff; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Deck of Worlds: tracking debug</h1>
<div class="grid">
  <div class="panel">
    <h2>Phone camera</h2>
    <img class="view" id="frame" alt="Latest camera frame">
    <div class="row">
      <span class="pill" id="cam">camera</span><span class="pill" id="area">play area</span><span id="fps"></span>
    </div>
    <div class="row">
      <button id="flip" title="Rotate the table 180°">Rotate table 180°</button>
      <button id="relock">Find border again</button>
      <button id="snap">Save this frame</button>
      <span id="saved"></span>
    </div>
  </div>
  <div class="panel">
    <h2>Top-down view (orange = ink, red = hand, box = word)</h2>
    <img class="view" id="rect" alt="Rectified play area with detections">
    <h2 style="margin-top:14px">Card check</h2>
    <table><thead><tr><th>Scrap</th><th>Read as</th><th>Card</th><th>Where</th></tr></thead><tbody id="cards"></tbody></table>
  </div>
  <div class="panel">
    <h2>Connect the phone</h2>
    <div id="links"></div>
    <p style="color:#8f9aad">Phone and laptop must be on the same network: turn on the iPhone's Personal Hotspot and join it from this laptop, then scan.</p>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let urls = '';
async function post(path) { return (await fetch(path, { method: 'POST' })).json(); }
$('flip').onclick = () => post('/api/flip');
$('relock').onclick = () => post('/api/relock');
$('snap').onclick = async () => { try { $('saved').textContent = 'Saved ' + (await post('/api/snap')).saved; } catch (e) { $('saved').textContent = 'No frame yet'; } };

async function tick() {
  try {
    const info = await (await fetch('/api/info')).json();
    $('cam').className = 'pill ' + (info.camera.connected ? 'ok' : 'bad');
    $('cam').textContent = info.camera.connected ? 'camera connected' : 'no camera';
    $('area').className = 'pill ' + (info.playArea.found ? 'ok' : info.playArea.locked ? 'warn' : 'bad');
    $('area').textContent = info.playArea.found ? 'play area found' : info.playArea.locked ? 'border hidden' : 'no play area';
    $('fps').textContent = info.camera.fps + ' fps · ' + info.camera.processMs + ' ms/frame' + (info.playArea.flip ? ' · rotated' : '');
    const key = info.phoneUrls.join('|');
    if (key !== urls) {
      urls = key;
      $('links').innerHTML = info.phoneUrls.length ? info.phoneUrls.map((u, i) =>
        `<img class="qr" src="/api/qr.svg?i=${i}&t=${Date.now()}" alt="QR code for ${u}"><p><code>${u}</code></p>`).join('')
        : '<p>No network found.</p>';
    }
    const rows = [...info.cards.map(c => ({ ...c, known: true })), ...info.candidates.map(c => ({ ...c, known: false }))];
    $('cards').innerHTML = rows.map(c => `<tr>
      <td><img src="/api/crop/${c.id}.jpg?t=${Date.now()}" alt=""></td>
      <td>${c.known ? '' : (c.text || '…') + ' <span style="color:#8f9aad">' + (c.confidence ?? '') + '</span>'}</td>
      <td>${c.known ? '<span class="pill ok">✓ ' + c.card.toUpperCase() + '</span>' + (c.visible ? '' : ' <span class="pill">hidden</span>') : '<span class="pill warn">not a card</span>'}</td>
      <td>${c.x.toFixed(2)}, ${c.y.toFixed(2)}</td></tr>`).join('') || '<tr><td colspan="4" style="color:#8f9aad">No scraps in view.</td></tr>';
    if (info.camera.connected) {
      $('frame').src = '/api/frame.jpg?t=' + Date.now();
      if (info.playArea.locked) $('rect').src = '/api/rectified.jpg?t=' + Date.now();
    }
  } catch (e) {
    $('cam').className = 'pill bad'; $('cam').textContent = 'server not running';
  }
  setTimeout(tick, 400);
}
tick();
</script>
</body>
</html>
